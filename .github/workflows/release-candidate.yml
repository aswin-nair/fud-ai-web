name: Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate version recorded in docs/release/evidence.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ inputs.candidate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/app/package-lock.json
            mobile/package-lock.json

      - name: Install web API dependencies
        run: npm ci --prefix web

      - name: Install web client dependencies
        run: npm ci --prefix web/app

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Install browser
        run: npx --prefix web/app playwright install chromium --with-deps

      - name: Repository policy checks
        run: |
          npm run security:scan
          npm run copy-policy
          npm run release:check:test
          npm run release:check:structure
          npm run support:check

      - name: Unit and boundary tests
        run: npm test
        env:
          CI: true

      - name: Type, lint, and local production build
        run: |
          npm run typecheck:api
          npm run typecheck:mobile
          npm run lint
          npm run verify:deploy
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ''

      - name: Local browser suite
        run: npm run test:e2e
        env:
          CI: true
          VITE_GOOGLE_CLIENT_ID: ''

      - name: Release-candidate cloud build
        run: npm run build:release
        env:
          VITE_GOOGLE_CLIENT_ID: ''
          RELEASE_ID: ${{ github.sha }}

      - name: Hosted cloud integration suite
        run: npm run test:staging
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}

      - name: Mobile export check
        run: npm run export:check --prefix mobile
        env:
          EXPO_EXPORT: ${{ secrets.EXPO_EXPORT }}

      - name: Collect release bundle
        if: always()
        run: npm run release:bundle
        env:
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BUNDLE_DIR: release-artifacts
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          EXPO_EXPORT: ${{ secrets.EXPO_EXPORT }}

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ inputs.candidate }}
          path: |
            release-artifacts/
            web/app/playwright-report/
            web/app/dist/release-info.json
          if-no-files-found: warn
          retention-days: 30

      - name: Evidence gate
        if: always()
        run: npm run release:check
        env:
          RELEASE_CANDIDATE: ${{ inputs.candidate }}
          RELEASE_COMMIT: ${{ github.sha }}
