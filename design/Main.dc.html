<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #E8623A; } a:hover { color: #C9502C; }
    * { box-sizing: border-box; }
    .fk { font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif; }
  </style>
</helmet>

<div style="width: 420px; height: 900px; background: #F6F1EA; position: relative; overflow: hidden; color: #1A1A1A;">

  <!-- Status bar: streak, XP, freezes — chunky pills -->
  <div style="display: flex; gap: 8px; padding: 16px 16px 14px;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <div style="flex: 1; background: #FFFFFF; border: 2px solid rgba(26,20,14,0.10); border-bottom-width: 4px; border-radius: 16px; padding: 8px 6px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span style="font-size: 15px;">{{c.icon}}</span>
        <span class="fk" style="font-size: 15px; font-weight: 600; color: {{c.color}};">{{c.value}}</span>
      </div>
    </sc-for>
  </div>

  <!-- HERO: the day as a path of meal slots -->
  <div style="margin: 0 16px; background: #FFFFFF; border: 2px solid rgba(26,20,14,0.10); border-bottom-width: 5px; border-radius: 26px; padding: 18px 18px 20px; position: relative; overflow: hidden;">

    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
      <div>
        <div class="fk" style="font-size: 40px; line-height: 1; font-weight: 600;">1,747</div>
        <div style="font-size: 12px; color: #7A7266; margin-top: 3px; font-weight: 600;">kcal left today</div>
      </div>
      <div style="text-align: right;">
        <div class="fk" style="font-size: 15px; font-weight: 600; color: #FF7A50;">2 of 4</div>
        <div style="font-size: 11px; color: #A69C8C; margin-top: 2px;">meals logged</div>
      </div>
    </div>

    <!-- The path -->
    <div style="position: relative; height: 232px; margin-top: 16px;">
      <svg width="384" height="232" viewBox="0 0 384 232" style="position: absolute; inset: 0;">
        <path d="M60 34 C 150 34, 150 92, 240 92 S 330 150, 240 150 S 100 208, 190 208"
              fill="none" stroke="#EFE6D8" stroke-width="10" stroke-linecap="round" stroke-dasharray="0"></path>
        <path d="M60 34 C 150 34, 150 92, 240 92"
              fill="none" stroke="#FF7A50" stroke-width="10" stroke-linecap="round"></path>
      </svg>

      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="4">
        <div style="position: absolute; left: {{n.x}}; top: {{n.y}}; transform: translate(-50%, -50%); text-align: center;">
          <div style="width: {{n.size}}; height: {{n.size}}; border-radius: 999px; background: {{n.bg}}; border: 3px solid {{n.border}}; border-bottom-width: {{n.depth}}; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
            <span style="font-size: {{n.icon_size}};">{{n.icon}}</span>
          </div>
          <div class="fk" style="font-size: 11px; font-weight: 600; margin-top: 5px; color: {{n.fg}};">{{n.label}}</div>
        </div>
      </sc-for>

      <!-- The mascot stands at the meal you are on -->
      <div style="position: absolute; left: 292px; top: 128px;">
        <svg width="58" height="58" viewBox="0 0 100 100">
          <path d="M50 9 L57 21 Q50 18 43 21 Z" fill="#E8623A"></path>
          <rect x="21" y="20" width="58" height="62" rx="26" fill="{{accent}}"></rect>
          <ellipse cx="50" cy="53" rx="22" ry="19" fill="#FFFFFF"></ellipse>
          <path d="M34 48 a6 6 0 0 1 12 0" stroke="#1A1A1A" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <path d="M54 48 a6 6 0 0 1 12 0" stroke="#1A1A1A" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <path d="M41 62 a9 9 0 0 0 18 0" stroke="#1A1A1A" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <circle cx="34" cy="60" r="4.5" fill="#E8623A" fill-opacity="0.3"></circle>
          <circle cx="66" cy="60" r="4.5" fill="#E8623A" fill-opacity="0.3"></circle>
        </svg>
      </div>
    </div>
  </div>

  <!-- Macros as chunky chips -->
  <div style="display: flex; gap: 8px; padding: 12px 16px 0;">
    <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
      <div style="flex: 1; background: #FFFFFF; border: 2px solid rgba(26,20,14,0.10); border-bottom-width: 4px; border-radius: 16px; padding: 10px 10px 11px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; color: #A69C8C;">{{m.name}}</span>
          <span class="fk" style="font-size: 13px; font-weight: 600; color: {{m.color}};">{{m.have}}</span>
        </div>
        <div style="height: 7px; border-radius: 999px; background: #EFE6D8; margin-top: 7px; overflow: hidden;">
          <div style="width: {{m.pct}}; height: 100%; border-radius: 999px; background: {{m.color}};"></div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- Quest -->
  <div style="margin: 12px 16px 0; background: #FFFFFF; border: 2px solid rgba(255,122,80,0.35); border-bottom-width: 4px; border-radius: 20px; padding: 13px 16px; display: flex; align-items: center; gap: 13px;">
    <div style="width: 40px; height: 40px; border-radius: 14px; background: rgba(255,122,80,0.12); display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8623A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M2 5h20v4H2zM12 5v16"></path></svg>
    </div>
    <div style="flex: 1;">
      <div class="fk" style="font-size: 14px; font-weight: 600;">Log 3 meals today</div>
      <div style="height: 6px; border-radius: 999px; background: #EFE6D8; margin-top: 6px; overflow: hidden;">
        <div style="width: 66%; height: 100%; border-radius: 999px; background: #FFB347;"></div>
      </div>
    </div>
    <span class="fk" style="font-size: 14px; font-weight: 600; color: #7A7266;">2/3</span>
  </div>

  <!-- Primary action -->
  <div style="position: absolute; left: 16px; right: 16px; bottom: 90px;">
    <div style="position: relative; padding-bottom: 6px;">
      <div style="position: absolute; inset: 6px 0 0; border-radius: 20px; background: #C9502C;"></div>
      <div class="fk" style="position: relative; height: 58px; border-radius: 20px; background: {{accent}}; color: #fff; display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 600; font-size: 17px; letter-spacing: 0.5px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        LOG A MEAL
      </div>
    </div>
  </div>

  <!-- Nav -->
  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 66px; border-radius: 24px; background: #FFFFFF; border: 2px solid rgba(26,20,14,0.10); border-bottom-width: 5px; display: flex; align-items: center; padding: 0 6px;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.path}}"></path></svg>
        <span class="fk" style="font-size: 10px; font-weight: 500; color: {{n.color}};">{{n.label}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A50","section":"Theme"},"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF7A50';
    const chips = [
      { icon: '🔥', value: '6', color: '#1A1A1A' },
      { icon: '⭐', value: '45', color: '#1A1A1A' },
      { icon: '❄️', value: '1', color: '#1A1A1A' },
    ];
    const done = { bg: accent, border: '#C9502C', depth: '5px', fg: '#1A1A1A', size: '58px', icon_size: '22px' };
    const now = { bg: '#FFFFFF', border: accent, depth: '5px', fg: '#1A1A1A', size: '68px', icon_size: '26px' };
    const todo = { bg: '#EFE6D8', border: '#E3D7C6', depth: '4px', fg: '#A69C8C', size: '54px', icon_size: '20px' };
    const nodes = [
      { ...done, label: 'Breakfast', icon: '✅', x: '60px', y: '34px' },
      { ...done, label: 'Lunch', icon: '✅', x: '240px', y: '92px' },
      { ...now, label: 'Dinner', icon: '🍲', x: '240px', y: '150px' },
      { ...todo, label: 'Snack', icon: '🍎', x: '190px', y: '208px' },
    ];
    const macros = [
      { name: 'PROTEIN', have: '75g', pct: '67%', color: '#6B9FFF' },
      { name: 'CARBS', have: '75g', pct: '45%', color: '#FFB347' },
      { name: 'FAT', have: '24g', pct: '39%', color: '#FF6B9D' },
    ];
    const nav = [
      { label: 'Today', color: accent, path: 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { label: 'Progress', color: '#A69C8C', path: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { label: 'Saved', color: '#A69C8C', path: 'M12 3l2.5 5.5L20 9.5l-4 4 1 6-5-2.8L7 19.5l1-6-4-4 5.5-1z' },
      { label: 'You', color: '#A69C8C', path: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
    ];
    return { accent, chips, nodes, macros, nav };
  }
}
</script>
</body>
</html>
