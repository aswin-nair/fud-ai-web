<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #E8623A; } a:hover { color: #C9502C; }
    * { box-sizing: border-box; }
    .fk { font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif; }
    .clay {
      background: linear-gradient(160deg, #FFFFFF 0%, #F8F2EA 100%);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.95), inset 0 -9px 14px rgba(26,20,14,0.07), 0 16px 28px rgba(26,20,14,0.10), 0 2px 4px rgba(26,20,14,0.05);
    }
    .clay-sunk {
      background: linear-gradient(160deg, #EFE7DC 0%, #F7F1E9 100%);
      box-shadow: inset 0 5px 10px rgba(26,20,14,0.13), inset 0 -3px 6px rgba(255,255,255,0.80);
    }
    .clay-coral {
      background: linear-gradient(160deg, #FF9068 0%, #F0663C 100%);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.40), inset 0 -10px 16px rgba(140,45,15,0.30), 0 16px 26px rgba(255,122,80,0.34), 0 2px 4px rgba(140,45,15,0.16);
    }
  </style>
</helmet>

<div style="width: 420px; height: 900px; background: #F6F1EA; position: relative; overflow: hidden; color: #1A1A1A;">

  <!-- Counters -->
  <div style="display: flex; gap: 10px; padding: 18px 18px 14px;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <div class="clay" style="flex: 1; border-radius: 22px; padding: 11px 6px; display: flex; align-items: center; justify-content: center; gap: 7px;">
        <span style="font-size: 16px;">{{c.icon}}</span>
        <span class="fk" style="font-size: 16px; font-weight: 600;">{{c.value}}</span>
      </div>
    </sc-for>
  </div>

  <!-- HERO — the ring is the interactive object. Tap the centre to log;
       tap a macro arc to filter the day to that macro. -->
  <div class="clay" style="margin: 0 18px; border-radius: 36px; padding: 24px 20px 22px;">
    <div style="position: relative; width: 240px; height: 240px; margin: 0 auto;">

      <div class="clay-sunk" style="position: absolute; inset: 0; border-radius: 999px;"></div>

      <svg width="240" height="240" style="position: absolute; inset: 0;">
        <defs>
          <linearGradient id="rope" x1="0" y1="0" x2="0.5" y2="1">
            <stop offset="0%" stop-color="#FFA47C"></stop>
            <stop offset="100%" stop-color="#EF6237"></stop>
          </linearGradient>
        </defs>
        <g transform="rotate(-90 120 120)">
          <circle cx="120" cy="120" r="104" fill="none" stroke="url(#rope)" stroke-width="18" stroke-linecap="round" stroke-dasharray="653" stroke-dashoffset="457"></circle>
        </g>
      </svg>

      <!-- The centre is a pressable puck -->
      <div class="clay" style="position: absolute; inset: 30px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div class="fk" style="font-size: 46px; line-height: 1; font-weight: 600;">1,747</div>
        <div style="font-size: 11px; color: #7A7266; font-weight: 600; margin-top: 4px;">kcal left</div>
        <div class="clay-sunk" style="margin-top: 12px; border-radius: 999px; padding: 6px 14px; display: flex; align-items: center; gap: 6px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E8623A" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          <span class="fk" style="font-size: 11px; font-weight: 600; color: #E8623A;">Tap to log</span>
        </div>
      </div>

      <!-- The mascot sits on the rim and reacts to logging, never to the number -->
      <div style="position: absolute; right: -12px; bottom: 2px;">
        <svg width="70" height="70" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="mbody" x1="0" y1="0" x2="0.4" y2="1">
              <stop offset="0%" stop-color="#FF9668"></stop>
              <stop offset="100%" stop-color="#EF6237"></stop>
            </linearGradient>
          </defs>
          <path d="M50 9 L57 21 Q50 18 43 21 Z" fill="#E05A30"></path>
          <rect x="21" y="20" width="58" height="62" rx="27" fill="url(#mbody)"></rect>
          <ellipse cx="50" cy="35" rx="20" ry="9" fill="#FFFFFF" fill-opacity="0.22"></ellipse>
          <ellipse cx="50" cy="53" rx="22" ry="19" fill="#FFF8F3"></ellipse>
          <path d="M34 48 a6 6 0 0 1 12 0" stroke="#2A1F18" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <path d="M54 48 a6 6 0 0 1 12 0" stroke="#2A1F18" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <path d="M41 62 a9 9 0 0 0 18 0" stroke="#2A1F18" stroke-width="3.6" fill="none" stroke-linecap="round"></path>
          <circle cx="33" cy="60" r="4.6" fill="#E8623A" fill-opacity="0.28"></circle>
          <circle cx="67" cy="60" r="4.6" fill="#E8623A" fill-opacity="0.28"></circle>
        </svg>
      </div>
    </div>

    <!-- Macros live with the ring: same fact, finer grain. Each is tappable. -->
    <div style="display: flex; gap: 10px; margin-top: 6px;">
      <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
        <div class="clay-sunk" style="flex: 1; border-radius: 20px; padding: 11px 12px 13px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span style="font-size: 9px; font-weight: 800; letter-spacing: 0.07em; color: #A69C8C;">{{m.name}}</span>
            <span class="fk" style="font-size: 13px; font-weight: 600; color: {{m.color}};">{{m.have}}</span>
          </div>
          <div style="height: 8px; border-radius: 999px; background: rgba(26,20,14,0.07); margin-top: 8px; overflow: hidden;">
            <div style="width: {{m.pct}}; height: 100%; border-radius: 999px; background: linear-gradient(160deg, {{m.light}}, {{m.color}});"></div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Today's meals — the day as a list, not a path -->
  <div style="padding: 18px 18px 0;">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;">
      <span class="fk" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #A69C8C;">TODAY</span>
      <span style="font-size: 11px; color: #7A7266;">2 meals · 705 kcal</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <sc-for list="{{meals}}" as="m" hint-placeholder-count="2">
        <div class="clay" style="border-radius: 22px; padding: 13px 16px; display: flex; align-items: center; gap: 13px;">
          <div class="clay-sunk" style="width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex: none;">
            <span style="font-size: 17px;">{{m.icon}}</span>
          </div>
          <div style="flex: 1;">
            <div class="fk" style="font-size: 14px; font-weight: 600;">{{m.name}}</div>
            <div style="font-size: 10px; color: #A69C8C; margin-top: 2px;">{{m.slot}}</div>
          </div>
          <span class="fk" style="font-size: 14px; font-weight: 600; color: #7A7266;">{{m.kcal}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 18px; right: 18px; bottom: 106px;">
    <div class="clay-coral fk" style="height: 64px; border-radius: 26px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: 0.5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      LOG A MEAL
    </div>
  </div>

  <div class="clay" style="position: absolute; left: 14px; right: 14px; bottom: 14px; height: 74px; border-radius: 30px; display: flex; align-items: center; padding: 0 10px;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <div class="{{n.cls}}" style="flex: 1; border-radius: 20px; padding: 9px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 0 3px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.path}}"></path></svg>
        <span class="fk" style="font-size: 10px; font-weight: 500; color: {{n.color}};">{{n.label}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = [
      { icon: '🔥', value: '6' },
      { icon: '⭐', value: '45' },
      { icon: '❄️', value: '1' },
    ];
    const macros = [
      { name: 'PROTEIN', have: '75g', pct: '67%', color: '#6B9FFF', light: '#9CC0FF' },
      { name: 'CARBS', have: '75g', pct: '45%', color: '#FFB347', light: '#FFCE86' },
      { name: 'FAT', have: '24g', pct: '39%', color: '#FF6B9D', light: '#FF9CBE' },
    ];
    const meals = [
      { icon: '🥣', name: 'Greek yoghurt', slot: 'Breakfast · 08:20', kcal: '180' },
      { icon: '🥗', name: 'Chicken salad', slot: 'Lunch · 13:05', kcal: '525' },
    ];
    const nav = [
      { label: 'Today', color: '#E8623A', cls: 'clay-sunk', path: 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { label: 'Journey', color: '#A69C8C', cls: '', path: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
      { label: 'Saved', color: '#A69C8C', cls: '', path: 'M12 3l2.5 5.5L20 9.5l-4 4 1 6-5-2.8L7 19.5l1-6-4-4 5.5-1z' },
      { label: 'You', color: '#A69C8C', cls: '', path: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
    ];
    return { chips, macros, meals, nav };
  }
}
</script>
</body>
</html>
