<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #E8623A; } a:hover { color: #C9502C; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 420px; height: 900px; background: #F6F1EA; position: relative; overflow: hidden; color: #1A1A1A;">
  <div style="padding: 18px 16px 4px; font-size: 13px; color: #7A7266;">‹ Back</div>
  <div style="padding: 6px 16px 14px; font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600;">Log a meal</div>

  <div style="margin: 0 16px 16px;">
    <div style="height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(255,122,80,0.55); display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #A69C8C;">Search your foods, or type calories</div>
  </div>

  <div style="padding: 0 16px 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A69C8C; font-family: 'JetBrains Mono', monospace;">Recent</div>
  <div style="margin: 0 16px 20px; background: #FFFFFF; border-radius: 12px; padding: 15px 16px; display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 17px;">🍽</span>
    <span style="flex: 1; font-size: 14px;">Chicken salad</span>
    <span style="font-size: 13px; font-weight: 600; color: #FF7A50;">75 kcal</span>
  </div>

  <div style="padding: 0 16px 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #A69C8C; font-family: 'JetBrains Mono', monospace;">Other ways to log</div>
  <!-- Four pastel tints that exist nowhere else in the palette -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0 16px;">
    <sc-for list="{{ways}}" as="w" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 16px;">
        <div style="width: 34px; height: 34px; border-radius: 12px; background: {{w.tint}}; display: flex; align-items: center; justify-content: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{w.stroke}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{w.path}}"></path></svg>
        </div>
        <div style="font-size: 14px; font-weight: 700; margin-top: 12px;">{{w.title}}</div>
        <div style="font-size: 11px; color: #A69C8C; margin-top: 4px; line-height: 1.4;">{{w.desc}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 560px; bottom: 90px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #D8CFC2;">— dead space —</div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 64px; border-radius: 36px; background: rgba(26,23,20,0.94); display: flex; align-items: center; padding: 6px 4px;">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{n.color}};">
        <span style="font-size: 15px;">{{n.icon}}</span>
        <span style="font-size: 9px;">{{n.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ways = [
      { title: 'Describe your meal', desc: 'Type anything — AI estimates your macros', tint: 'rgba(255,122,80,0.14)', stroke: '#E8623A', path: 'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z' },
      { title: 'Snap a photo', desc: 'AI reads the nutrition', tint: 'rgba(107,159,255,0.16)', stroke: '#3457C7', path: 'M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
      { title: 'Saved meals', desc: 'Everything you have kept', tint: 'rgba(255,179,71,0.2)', stroke: '#B8650C', path: 'M12 3l2.5 5.5L20 9.5l-4 4 1 6-5-2.8L7 19.5l1-6-4-4 5.5-1z' },
      { title: 'Manual entry', desc: 'Enter known macros', tint: 'rgba(52,199,89,0.16)', stroke: '#1E9E4A', path: 'M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 8h6M9 12h6M9 16h4' },
    ];
    const nav = [
      { icon: '⌂', label: 'Home', color: 'rgba(255,255,255,0.5)' },
      { icon: '◷', label: 'Progress', color: 'rgba(255,255,255,0.5)' },
      { icon: '＋', label: 'Log', color: '#FFFFFF' },
      { icon: '☆', label: 'Discover', color: 'rgba(255,255,255,0.5)' },
      { icon: '⚙', label: 'Settings', color: 'rgba(255,255,255,0.5)' },
    ];
    return { ways, nav };
  }
}
</script>
</body>
</html>
