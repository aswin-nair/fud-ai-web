<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #E8623A; } a:hover { color: #C9502C; }
    * { box-sizing: border-box; }
    .fk { font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif; }
    .clay {
      background: linear-gradient(160deg, #FFFFFF 0%, #F8F2EA 100%);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.95), inset 0 -9px 14px rgba(26,20,14,0.07), 0 16px 28px rgba(26,20,14,0.10), 0 2px 4px rgba(26,20,14,0.05);
    }
    .clay-sunk {
      background: linear-gradient(160deg, #EFE7DC 0%, #F7F1E9 100%);
      box-shadow: inset 0 5px 10px rgba(26,20,14,0.13), inset 0 -3px 6px rgba(255,255,255,0.80);
    }
    .clay-picked {
      background: linear-gradient(160deg, #FFF3ED 0%, #FFE4D8 100%);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.90), inset 0 -9px 14px rgba(200,90,50,0.14), 0 18px 30px rgba(255,122,80,0.20), 0 2px 4px rgba(140,45,15,0.08);
    }
    .clay-ink {
      background: linear-gradient(160deg, #34302B 0%, #1A1714 100%);
      box-shadow: inset 0 6px 10px rgba(255,255,255,0.14), inset 0 -10px 16px rgba(0,0,0,0.45), 0 16px 26px rgba(26,20,14,0.28), 0 2px 4px rgba(26,20,14,0.18);
    }
  </style>
</helmet>

<div style="width: 420px; height: 900px; background: #F6F1EA; position: relative; overflow: hidden; color: #1A1A1A;">

  <!-- Progress: a sunk channel with a coral rope in it -->
  <div style="display: flex; align-items: center; gap: 14px; padding: 22px 20px 0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7A7266" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    <div class="clay-sunk" style="flex: 1; height: 12px; border-radius: 999px; overflow: hidden;">
      <div style="width: 46%; height: 100%; border-radius: 999px; background: linear-gradient(160deg, #FFA47C, #EF6237);"></div>
    </div>
  </div>

  <div style="padding: 34px 24px 0;">
    <div class="fk" style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #A69C8C;">STEP 4 OF 7</div>

    <h1 class="fk" style="font-size: 34px; line-height: 1.12; font-weight: 600; margin: 12px 0 0; letter-spacing: -0.01em;">What are you working towards?</h1>

    <!-- Every question says why it is asked. Same instinct as never clamping silently. -->
    <p style="font-size: 14px; line-height: 1.55; color: #7A7266; margin: 14px 0 0;">This sets the direction of your daily calorie target. You can change it any time, and nothing here locks you in.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 32px 24px 0;">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <div class="{{o.cls}}" style="border-radius: 26px; padding: 20px 22px; display: flex; align-items: center; gap: 16px;">
        <div class="{{o.iconCls}}" style="width: 48px; height: 48px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{o.stroke}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{o.path}}"></path></svg>
        </div>
        <div style="flex: 1;">
          <div class="fk" style="font-size: 18px; font-weight: 600;">{{o.label}}</div>
          <div style="font-size: 12px; color: #7A7266; margin-top: 3px;">{{o.hint}}</div>
        </div>
        <sc-if value="{{o.selected}}" hint-placeholder-val="{{ true }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8623A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- The helper link, borrowed from the reference: a way to ask rather than guess -->
  <div style="position: absolute; left: 0; right: 0; bottom: 128px; text-align: center;">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #E8623A;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#E8623A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
      How is my target worked out?
    </span>
  </div>

  <!-- Ink clay for onward motion; coral clay is reserved for logging a meal -->
  <div style="position: absolute; left: 24px; right: 24px; bottom: 40px;">
    <div class="clay-ink fk" style="height: 62px; border-radius: 24px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; letter-spacing: 0.4px;">Continue</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const options = [
      {
        label: 'Lose weight', hint: 'A gentle, capped deficit', selected: true,
        cls: 'clay-picked', iconCls: 'clay', stroke: '#E8623A',
        path: 'M12 5v14M19 12l-7 7-7-7',
      },
      {
        label: 'Maintain', hint: 'Hold where you are', selected: false,
        cls: 'clay', iconCls: 'clay-sunk', stroke: '#7A7266',
        path: 'M5 12h14',
      },
      {
        label: 'Gain weight', hint: 'A steady surplus', selected: false,
        cls: 'clay', iconCls: 'clay-sunk', stroke: '#7A7266',
        path: 'M12 19V5M5 12l7-7 7 7',
      },
    ];
    return { options };
  }
}
</script>
</body>
</html>
