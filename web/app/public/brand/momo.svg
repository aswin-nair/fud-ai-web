" fill="url(#momo-cheek-_R_0_)"></ellipse><path class="momo-happy-mouth" d="M41 72q9 12 18 0Z"></path></g></g><g class="momo-feet momo-original-art"><ellipse cx="34" cy="92" rx="9" ry="5"></ellipse><ellipse cx="66" cy="92" rx="9" ry="5"></ellipse></g><g class="momo-celebration-sparks"><path d="M12 25v8M8 29h8M87 21v8M83 25h8"></path><circle cx="17" cy="16" r="2"></circle><circle cx="84" cy="37" r="1.8"></circle></g></svg>
