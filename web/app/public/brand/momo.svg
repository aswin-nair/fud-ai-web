<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 108" width="100%" height="100%" class="momo-art expression-momo mood-excited pose-still" data-expression="celebrating" aria-hidden="true"><style>svg{--coral:#FF8055;--cobalt:#5458C9}*{animation:none!important;transition:none!important}.momo-ground-shadow {
  fill: #3a2a22;
  opacity: 0.15;
  transform-origin: 50px 99px;
  animation: momo-shadow-breathe 3s ease-in-out infinite;
}

.momo-body-group { transform-origin: 50px 88px; }
.momo-outline {
  fill: none;
  stroke: #9f7548;
  stroke-width: 1.8;
  stroke-linejoin: round;
  opacity: 0.65;
}
.momo-pleats,
.momo-pleat-detail {
  fill: none;
  stroke: #c9975f;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.momo-pleats { stroke-width: 3.2; }
.momo-pleat-detail { stroke-width: 1.6; opacity: 0.7; }
.momo-highlight {
  fill: none;
  stroke: #fff;
  stroke-width: 4;
  stroke-linecap: round;
  opacity: 0.55;
}
.momo-arm {
  fill: none;
  stroke: #d8aa73;
  stroke-width: 8;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: center;
}
.momo-wave-lines,
.momo-celebration-sparks path {
  fill: none;
  stroke: var(--coral, #ff7a50);
  stroke-width: 2.2;
  stroke-linecap: round;
}
.momo-celebration-sparks { fill: var(--cobalt, #416ec3); }
.momo-blossom { fill: var(--coral, #ff7a50); }
.momo-blossom-core { fill: #ffc85a; }
.momo-open-eyes { fill: #fffdf8; stroke: #3a2a22; stroke-width: 1.8; }
.momo-pupils { fill: #3a2a22; stroke: none; }
.momo-eye-glint { fill: #fff; }
.momo-lash,
.momo-brow,
.momo-mouth,
.momo-sleepy-eyes path,
.momo-blink-eyes path {
  fill: none;
  stroke: #3a2a22;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.momo-lash { stroke-width: 1.8; }
.momo-brow { opacity: 0.72; }
.momo-mouth { stroke-width: 3; }
.momo-mouth-fill { fill: #7e493d; }
.momo-feet { fill: #c69057; }

.expression-momo .momo-outline { stroke: #6A3E2A; stroke-width: 2; opacity: 1; }
.expression-momo .momo-happy-eyes, .expression-momo .momo-wink-eye { fill: none; stroke: #3A2A22; stroke-width: 3; stroke-linecap: round; }
